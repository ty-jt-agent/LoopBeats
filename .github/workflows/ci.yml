name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web checks and production startup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: rustup show
      - run: npm run test:browser
      - run: npm run test:browser:fx
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
  rust:
    name: Rust checks and WASM build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo build --locked --release --target wasm32-unknown-unknown -p loop-engine
  windows-shell:
    name: Windows Tauri build and launch smoke
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Check and test native WASAPI host
        run: |
          cargo check --locked --all-targets -p windows-audio-host --target x86_64-pc-windows-msvc
          cargo test --locked -p windows-audio-host
      - name: Test Windows bridge handlers
        run: cargo test --locked --manifest-path apps/windows/src-tauri/Cargo.toml --target x86_64-pc-windows-msvc
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build Windows x64 shell with startup smoke enabled
        shell: pwsh
        run: |
          $env:VITE_WINDOWS_SHELL_SMOKE = 'true'
          npm run tauri:build
      - name: Launch packaged shell and verify native host startup state
        shell: pwsh
        run: ./apps/windows/scripts/smoke.ps1
